<!DOCTYPE html>

<html lang="es"></html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--CSS de bootstrap 5.3.3 dede url predeterminada-->
    <link href="http://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--libreria icono de bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css rel="stylesheet">
    <link href="estilos.css" rel="stylesheet"><!--link es para enlazar el archivo css con el html, href es la ruta del archivo css, rel es la relación entre los archivos-->
</head>
<body class="bg-body-tertiary">
    <!--offcanvas en pantallas menores al lg se muestra normal. offcanvas-start lo hace salir por la izquierda . sidebar es muestra la calse del id usa el boton q lo abre-->
    <aside class="offcanvas lg offcanvas-start sidebar"
    tabindex="-1" id="menulateral"
    aria-labelledby="Titulomenu">
    <!--encabezado del panel; bootstrap solo muestra en celular-->
    <div class="offcanvas-header border-secondary">
        <!--nombre del sistema en el panel movil-->
        <h5 class="offcanvas-title id="titulomenu"><i class="bi bi-shop" me-2></i>tienda sena</h5>
        <!--boton en blanco del cierre del panel-->
        <button type="button" class="btn-close-btn-close-white"
        data-bs-dismis="offcanvas"
        data-bs-target="#menulateral"
        aria-label="cerrar menu"></button>
        <!--cierra en encabezado movil-->
    </div>
    <!--cuerpo del menu flexbox en columna para aplilar logo enlaces y boton de salida-->
    <div class="offcanvas-body d-flex-column p-3">
        <!--logo solo se ve en computador-->
        <a href="dashboard.html" class="d-none d-lg-flex aling-items-center mb-3 text-white text-decoration-none fs-5>
        <i class="bi bi shop me-2 text-sena"><</i>tienda sena 
        <!--cierra el logo-->
        </a>
    </div>
    </aside>
